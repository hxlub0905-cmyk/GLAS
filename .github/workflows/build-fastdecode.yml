name: build-fastdecode

# Builds the optional native decode extension (F26) on a Windows runner (which
# ships MSVC), for the exact Python the operator uses (3.9 x64), and uploads the
# .pyd as a downloadable artifact. This is the "no local compiler" delivery
# path: download the artifact and drop oasis_fastdecode.cp39-win_amd64.pyd into
# glas/core/ on the locked-down machine — no install, just a file.

on:
  push:
    paths:
      - "glas/core/oasis_fastdecode.pyx"
      - "setup.py"
      - ".github/workflows/build-fastdecode.yml"
  workflow_dispatch: {}   # also runnable on demand from the Actions tab

jobs:
  build-windows-cp39:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9 (x64) — match the operator runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: "x64"

      - name: Install build deps
        run: python -m pip install --upgrade pip cython setuptools wheel

      - name: Compile the extension (MSVC)
        run: python setup.py build_ext --inplace

      - name: Stage + smoke-test the built .pyd
        shell: pwsh
        run: |
          # build_ext --inplace drops it at the repo root for a top-level
          # module; move it into glas/core (which is on sys.path) and import it.
          Get-ChildItem -Recurse -Filter "oasis_fastdecode*.pyd" | ForEach-Object {
            Copy-Item $_.FullName -Destination "glas/core/" -Force
          }
          Get-ChildItem "glas/core/oasis_fastdecode*.pyd"
          python -c "import sys; sys.path.insert(0, 'glas/core'); import oasis_fastdecode as f; print('VERSION', f.VERSION, 'selftest', f.selftest())"

      - name: Round-trip test against the pure-Python readers
        run: |
          python -m pip install pytest
          python -m pytest tests/test_fastdecode.py -v

      - name: Upload the .pyd artifact
        uses: actions/upload-artifact@v4
        with:
          name: oasis_fastdecode-cp39-win_amd64
          path: glas/core/oasis_fastdecode*.pyd
          if-no-files-found: error
